name: Mirror to atriaeponym.com

# Copies this site to atriaeponym/atriaeponym.com on every push, rewriting absolute links to the
# new domain. Same copy as the scheduled `mirror` workflow of that repository, which stays as a
# fallback. Writes with the deploy key of atriaeponym.com stored in secret MIRROR_DEPLOY_KEY.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
      - uses: actions/checkout@v7
        with:
          repository: atriaeponym/atriaeponym.com
          ssh-key: ${{ secrets.MIRROR_DEPLOY_KEY }}
          path: mirror
      - name: Copy and rewrite
        run: |
          rsync -a --delete \
            --exclude .git --exclude .github --exclude CNAME --exclude README.md --exclude .keepalive \
            source/ mirror/
          find mirror -path mirror/.git -prune -o -type f \( -name '*.html' -o -name '*.xml' -o -name '*.txt' \) -print0 \
            | xargs -0 sed -i 's#https://atriaeponym.github.io/#https://atriaeponym.com/#g'
          echo atriaeponym.com > mirror/CNAME
          date -u +%Y-%m > mirror/.keepalive
      - name: Commit (the push rebuilds the site)
        id: commit
        run: |
          cd mirror
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "sync: atriaeponym.github.io $(git -C ../source rev-parse --short HEAD)"
          # Both mirrors (this one and the one of the other repository) may push at the same moment.
          # If the push is refused, compare with what the other copy pushed and stop when it is the same.
          for attempt in 1 2 3; do
            if git push -q; then echo "pushed=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            git fetch -q origin main
            git reset -q --soft origin/main
            if git diff --cached --quiet; then echo "Already copied by the other mirror"; exit 0; fi
            git commit -qm "sync: atriaeponym.github.io $(git -C ../source rev-parse --short HEAD)"
          done
          exit 1
      - name: Tell search engines the pages changed (IndexNow, read by Bing and others)
        if: steps.commit.outputs.pushed == '1'
        # The key is public by design: IndexNow checks it at https://atriaeponym.com/<key>.txt
        env:
          KEY: 06ca0b3de0c154d5e2872c928abc9a7f
        run: |
          cd mirror
          urls=$(grep -o '<loc>[^<]*' sitemap.xml | sed 's/<loc>//' | jq -R . | jq -sc .)
          body=$(jq -nc --arg k "$KEY" --argjson u "$urls" \
            '{host:"atriaeponym.com",key:$k,keyLocation:("https://atriaeponym.com/"+$k+".txt"),urlList:$u}')
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json; charset=utf-8' \
            -d "$body" https://api.indexnow.org/indexnow || echo 000)
          echo "IndexNow: HTTP $code for $(echo "$urls" | jq length) URLs"
